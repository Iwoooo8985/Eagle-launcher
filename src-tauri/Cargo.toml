[package]
name = "unified-launcher"
version = "0.1.0"
description = "Minimalist Unified Game Launcher"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
sysinfo = "0.31"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
